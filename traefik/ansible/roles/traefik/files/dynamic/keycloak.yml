http:
  routers:
    to-keycloak:
      entryPoints:
        - websecure
      rule: "Host(`keycloak.jayforweb.com`)"
      service: keycloak
      tls: {} # Uses the default wildcard cert from tls.yml

  services:
    keycloak:
      loadBalancer:
        servers:
          - url: "http://192.168.193.70:8080"

 
